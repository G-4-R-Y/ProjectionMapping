[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projection-mapping-lab"
version = "0.2.2"
description = "Research toolkit for projector-camera calibration, generative projection mapping, and spatial AR"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "tomli>=2.0.1; python_version < '3.11'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.9"]
ml = ["torch>=2.2", "torchvision>=0.17"]
ui = ["textual>=0.70"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
projection-map = "projection_mapping.cli:main"
projection-ui = "projection_mapping.tui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

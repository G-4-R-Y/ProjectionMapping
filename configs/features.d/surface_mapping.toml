[[feature]]
id = "surface_mapper"
name = "Surface Mapper / Corner Pin"
category = "Projection Mapping"
description = "Map an animated calibration plate, image, or video onto one or more physical quadrilateral surfaces. Drag projector-space corners, feather edges, and autosave a resolution-independent JSON profile. F11 toggles fullscreen; ESC returns to the deck."
command = ["python", "experiments/33_surface_mapper.py"]
fullscreen = true
requires_modules = ["cv2"]

[[feature.param]]
key = "profile"
flag = "--profile"
label = "Mapping profile"
type = "text"
default = "calibration_data/surface_map.json"
help = "JSON file loaded at launch and autosaved after corner or surface edits."

[[feature.param]]
key = "source"
flag = "--source"
label = "Image / video source"
type = "text"
default = "builtin:calibration"
help = "Use builtin:calibration or a local image/video path."

[[feature.param]]
key = "clean_output"
flag = "--clean-output"
label = "Start without edit guides"
type = "bool"
default = false
help = "Press G in the projector window to show or hide guides at any time."

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "content_width"
flag = "--content-width"
label = "Content width"
type = "int"
default = 960
min = 160
max = 3840

[[feature.param]]
key = "content_height"
flag = "--content-height"
label = "Content height"
type = "int"
default = 540
min = 90
max = 2160

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Mapping render width"
type = "int"
default = 960
min = 320
max = 3840
help = "CPU mapping workspace; the final frame is scaled to the projector resolution."

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Mapping render height"
type = "int"
default = 540
min = 180
max = 2160

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature]]
id = "gpu_mapped_scene"
name = "GPU-Mapped Shader Scene"
category = "Projection Mapping"
description = "Render a promoted procedural scene into a saved multi-surface profile entirely on GPU, then present it through a native monitor-aware OpenGL window with zero framebuffer readbacks. F11 toggles fullscreen; ESC returns to the deck."
command = ["python", "experiments/34_gpu_mapped_scene.py"]
fullscreen = true
requires_modules = ["moderngl", "glfw"]

[[feature.param]]
key = "preset"
flag = "--preset"
label = "Authored look"
type = "choice"
default = "mercury_temple"
choices = ["custom", "mercury_temple", "black_sun_corona", "aurora_silk", "neon_reliquary", "choir_of_depth", "plasma_orchid", "vortex_coronation", "collapse_ritual", "amethyst_cavern", "solar_tapestry", "abyssal_bloom", "prismatic_altar"]
choice_labels = { custom = "Custom controls", mercury_temple = "Mercury Temple", black_sun_corona = "Black Sun Corona", aurora_silk = "Aurora Silk", neon_reliquary = "Neon Reliquary", choir_of_depth = "Choir of Depth", plasma_orchid = "Plasma Orchid", vortex_coronation = "Vortex Coronation", collapse_ritual = "Collapse Ritual", amethyst_cavern = "Amethyst Cavern", solar_tapestry = "Solar Tapestry", abyssal_bloom = "Abyssal Bloom", prismatic_altar = "Prismatic Altar" }
help = "Sets scene, speed, intensity and chaos together. Choose custom to use individual controls."

[[feature.param]]
key = "profile"
flag = "--profile"
label = "Mapping profile"
type = "text"
default = "calibration_data/surface_map.json"
help = "Create or edit this profile first with Surface Mapper / Corner Pin. A full-frame surface is used if the file does not exist."

[[feature.param]]
key = "scene"
flag = "--scene"
label = "Shader scene"
type = "choice"
default = "liquid_chrome"
choices = ["event_horizon", "aurora_void", "liquid_chrome", "neon_cathedral", "wormhole_choir", "plasma_singularity", "vortex_crown", "collapse_flower", "crystal_cavern", "solar_loom", "abyssal_garden", "prism_mirage"]
help = "Used when Authored look is custom."

[[feature.param]]
key = "chaos"
flag = "--chaos"
label = "Structured chaos"
type = "float"
default = 1.15
min = 0.0
max = 2.5

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Intensity"
type = "float"
default = 1.0
min = 0.0
max = 2.5

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display index"
type = "int"
default = 1
min = 0
max = 16
help = "Uses real GLFW monitor enumeration; 0 is the primary display."

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Scene texture width"
type = "int"
default = 960
min = 320
max = 3840

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Scene texture height"
type = "int"
default = 540
min = 180
max = 2160

[[feature.param]]
key = "window_width"
flag = "--window-width"
label = "Windowed width"
type = "int"
default = 1280
min = 320
max = 7680

[[feature.param]]
key = "window_height"
flag = "--window-height"
label = "Windowed height"
type = "int"
default = 720
min = 240
max = 4320

[[feature.param]]
key = "windowed"
flag = "--windowed"
label = "Start windowed"
type = "bool"
default = false

[[feature.param]]
key = "no_vsync"
flag = "--no-vsync"
label = "Disable VSync"
type = "bool"
default = false
help = "Useful only for throughput benchmarking; keep VSync enabled for projection."

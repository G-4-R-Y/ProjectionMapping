[[feature]]
id = "attractor_lab"
name = "Strange Attractor Lab / GPU"
category = "Visual Madness"
description = "Dense additive GPU renderings of classic chaotic systems: Lorenz, Rossler, Aizawa, Thomas, Halvorsen, Clifford, De Jong and Ikeda. Point clouds are precomputed once and animated as luminous mathematical sculptures. F11 toggles fullscreen."
command = ["python", "experiments/24_attractor_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "mode"
flag = "--mode"
label = "Attractor"
type = "choice"
default = "lorenz"
choices = ["lorenz", "rossler", "aizawa", "thomas", "halvorsen", "clifford", "de_jong", "ikeda"]

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "spectral"
choices = ["spectral", "electric", "solar", "bio", "ultraviolet"]

[[feature.param]]
key = "points"
flag = "--points"
label = "Trajectory points"
type = "choice"
default = "50000"
choices = ["12000", "25000", "50000", "90000"]

[[feature.param]]
key = "zoom"
flag = "--zoom"
label = "Camera zoom"
type = "float"
default = 1.35
min = 0.4
max = 3.0

[[feature.param]]
key = "point_size"
flag = "--point-size"
label = "Point glow size"
type = "float"
default = 2.2
min = 0.5
max = 8.0

[[feature.param]]
key = "bloom"
flag = "--bloom"
label = "Bloom"
type = "float"
default = 1.0
min = 0.0
max = 3.0

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Camera orbit speed"
type = "float"
default = 1.0
min = 0.05
max = 4.0

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Emissive intensity"
type = "float"
default = 1.0
min = 0.1
max = 3.0

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Render width"
type = "int"
default = 960
min = 320
max = 1920

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Render height"
type = "int"
default = 540
min = 180
max = 1080

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

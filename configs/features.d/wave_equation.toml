[[feature]]
id = "wave_equation_lab"
name = "Wave Equation / Cymatics GPU"
category = "Visual Madness"
description = "Persistent damped 2-D wave equation with Chladni/eigenmode forcing, multi-source resonance, spiral waves, chaotic boundaries, and an audio-oriented plate mode. Stateful GPU simulation. F11 toggles fullscreen."
command = ["python", "experiments/29_wave_equation_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "mode"
flag = "--mode"
label = "Wave system"
type = "choice"
default = "chladni_drive"
choices = ["membrane_drop", "chladni_drive", "multi_source_resonance", "spiral_wave", "chaotic_boundary", "audio_plate"]
group = "Design Customization"

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "ultraviolet"
choices = ["cyan_magenta", "spectral", "electric", "solar", "bio", "ultraviolet", "icefire"]
group = "Design Customization"

[[feature.param]]
key = "drive"
flag = "--drive"
label = "Forcing / excitation"
type = "float"
default = 0.45
min = 0.0
max = 1.5
group = "Behavior & Reactivity"
help = "How hard the membrane is continuously excited."

[[feature.param]]
key = "tension"
flag = "--tension"
label = "Wave tension (c²dt²)"
type = "float"
default = 0.22
min = 0.01
max = 0.48
group = "Design Customization"
help = "Core wave-equation propagation coefficient; high values approach the stability limit."

[[feature.param]]
key = "damping"
flag = "--damping"
label = "Damping"
type = "float"
default = 0.018
min = 0.0001
max = 0.20
group = "Design Customization"

[[feature.param]]
key = "steps"
flag = "--steps"
label = "Simulation steps / frame"
type = "int"
default = 3
min = 1
max = 12
group = "Performance & Advanced"

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Drive time speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Emissive intensity"
type = "float"
default = 1.0
min = 0.1
max = 3.0
group = "Design Customization"

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8
group = "Output & Resolution"

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Simulation/render width"
type = "int"
default = 640
min = 160
max = 1920
group = "Output & Resolution"

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Simulation/render height"
type = "int"
default = 360
min = 90
max = 1080
group = "Output & Resolution"

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680
group = "Output & Resolution"

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320
group = "Output & Resolution"

[[feature]]
id = "cyber_mage"
name = "Cyber Mage"
category = "Visual Madness"
description = "Persistent performer rig with body-owned sigils, plasma arcs, hand trails, aura, ground glyphs and charge/hold/release spell states. Deterministic realtime baseline first; neural style-skin comes later. F11 toggles fullscreen."
command = ["python", "experiments/13_cyber_mage.py"]
fullscreen = true

[[feature.param]]
key = "camera"
flag = "--camera"
label = "Camera"
type = "int"
default = 0
min = 0
max = 16

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "arcane"
choices = ["arcane", "solar", "void", "jade"]

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Spell intensity"
type = "float"
default = 1.0
min = 0.0
max = 2.0

[[feature.param]]
key = "complexity"
flag = "--complexity"
label = "Sigil complexity"
type = "float"
default = 0.78
min = 0.0
max = 1.0

[[feature.param]]
key = "trail_length"
flag = "--trail-length"
label = "Hand trail length"
type = "int"
default = 30
min = 2
max = 120

[[feature.param]]
key = "feedback"
flag = "--feedback"
label = "Afterimage persistence"
type = "float"
default = 0.90
min = 0.0
max = 0.985

[[feature.param]]
key = "rig_smoothing"
flag = "--rig-smoothing"
label = "Rig smoothing"
type = "float"
default = 0.72
min = 0.0
max = 0.98

[[feature.param]]
key = "charge_seconds"
flag = "--charge-seconds"
label = "Charge time to full spell (s)"
type = "float"
default = 0.65
min = 0.15
max = 3.0

[[feature.param]]
key = "camera_mix"
flag = "--camera-mix"
label = "Camera underlay"
type = "float"
default = 0.08
min = 0.0
max = 1.0

[[feature.param]]
key = "mirror"
flag = "--mirror"
label = "Mirror camera"
type = "bool"
default = true

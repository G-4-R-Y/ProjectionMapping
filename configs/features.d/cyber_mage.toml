[[feature]]
id = "cyber_mage"
name = "Cyber Mage SFX / Point Tracker"
category = "Visual Madness"
description = "Persistent Shi-Tomasi/Lucas-Kanade point tracks drive cinematic trails, plasma mesh, sparks and motion shockwaves. Optional ModernGL post shader adds coherent bloom/atmosphere. No fake hand-gesture assumptions. F11 toggles fullscreen."
command = ["python", "experiments/13_cyber_mage.py"]
fullscreen = true

[[feature.param]]
key = "camera"
flag = "--camera"
label = "Camera"
type = "int"
default = 0
min = 0
max = 16

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "mode"
flag = "--mode"
label = "SFX mode"
type = "choice"
default = "plasma_mesh"
choices = ["plasma_mesh", "constellation", "afterburner", "liquid_wire"]

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "cyber"
choices = ["cyber", "cyan_magenta", "ultraviolet", "toxic_pink", "deep_ocean", "sunset_neon", "ion", "acid", "ember", "ice"]

[[feature.param]]
key = "track_scope"
flag = "--track-scope"
label = "Track points on"
type = "choice"
default = "foreground"
choices = ["foreground", "full"]

[[feature.param]]
key = "max_points"
flag = "--max-points"
label = "Maximum tracked points"
type = "int"
default = 96
min = 12
max = 240

[[feature.param]]
key = "trail_length"
flag = "--trail-length"
label = "Track trail length"
type = "int"
default = 28
min = 2
max = 120

[[feature.param]]
key = "connection_radius"
flag = "--connection-radius"
label = "Plasma connection radius"
type = "float"
default = 95.0
min = 20.0
max = 300.0

[[feature.param]]
key = "point_radius"
flag = "--point-radius"
label = "Emitter point radius"
type = "float"
default = 2.2
min = 0.5
max = 12.0

[[feature.param]]
key = "feedback"
flag = "--feedback"
label = "Trail persistence"
type = "float"
default = 0.91
min = 0.0
max = 0.985

[[feature.param]]
key = "bloom"
flag = "--bloom"
label = "Bloom"
type = "float"
default = 1.0
min = 0.0
max = 2.5

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "SFX intensity"
type = "float"
default = 1.0
min = 0.0
max = 2.5

[[feature.param]]
key = "camera_mix"
flag = "--camera-mix"
label = "Camera underlay"
type = "float"
default = 0.03
min = 0.0
max = 1.0

[[feature.param]]
key = "mirror"
flag = "--mirror"
label = "Mirror camera"
type = "bool"
default = true

[[feature.param]]
key = "shader"
flag = "--shader"
label = "ModernGL cinematic post FX"
type = "bool"
default = true

[[feature.param]]
key = "shader_background"
flag = "--shader-background"
label = "Shader atmosphere"
type = "choice"
default = "nebula"
choices = ["black", "nebula", "grid", "liquid"]

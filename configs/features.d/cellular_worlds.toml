[[feature]]
id = "cellular_worlds_lab"
name = "Cellular Worlds / GPU"
category = "Visual Madness"
description = "Stateful ping-pong GPU cellular automata: Conway Life, Brian's Brain, 8-state cyclic automata and Seeds. Designed as crisp projector-native discrete worlds with deterministic stimulation and live reseeding. F11 toggles fullscreen, R reseeds."
command = ["python", "experiments/25_cellular_worlds_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "mode"
flag = "--mode"
label = "Automaton"
type = "choice"
default = "cyclic_8"
choices = ["conway_life", "brians_brain", "cyclic_8", "seeds"]

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "electric"
choices = ["electric", "bio", "solar", "ultraviolet", "icefire"]

[[feature.param]]
key = "density"
flag = "--density"
label = "Initial density"
type = "float"
default = 0.18
min = 0.01
max = 0.8

[[feature.param]]
key = "steps"
flag = "--steps"
label = "CA generations / frame"
type = "int"
default = 1
min = 1
max = 12

[[feature.param]]
key = "drive"
flag = "--drive"
label = "Installation stimulation"
type = "float"
default = 0.12
min = 0.0
max = 2.5

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Emissive intensity"
type = "float"
default = 1.0
min = 0.1
max = 3.0

[[feature.param]]
key = "seed"
flag = "--seed"
label = "Initial seed"
type = "int"
default = 17
min = 0
max = 999999

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Cell grid width"
type = "int"
default = 512
min = 128
max = 1920

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Cell grid height"
type = "int"
default = 288
min = 72
max = 1080

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

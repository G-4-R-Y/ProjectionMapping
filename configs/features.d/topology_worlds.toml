[[feature]]
id = "topology_worlds_lab"
name = "Topology Worlds / Knots + Minimal Surfaces"
category = "Visual Madness"
description = "Mathematical topology and differential-geometry worlds: torus knots, linked-fiber fields, gyroid and Schwarz-P implicit surfaces, helicoids, and Möbius ribbons. F11 toggles fullscreen."
command = ["python", "experiments/31_topology_worlds_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "mode"
flag = "--mode"
label = "Topology / surface"
type = "choice"
default = "torus_knot"
choices = ["torus_knot", "hopf_link_field", "gyroid", "schwarz_p", "helicoid", "mobius_ribbon"]
group = "Design Customization"

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "cyan_magenta"
choices = ["cyan_magenta", "spectral", "electric", "solar", "bio", "ultraviolet", "icefire"]
group = "Design Customization"

[[feature.param]]
key = "param_a"
flag = "--param-a"
label = "Equation parameter A"
type = "float"
default = 0.5
min = 0.0
max = 1.0
group = "Design Customization"
help = "Mode-specific structural parameter: knot frequencies, surface scale, or twist rate."

[[feature.param]]
key = "param_b"
flag = "--param-b"
label = "Equation parameter B"
type = "float"
default = 0.5
min = 0.0
max = 1.0
group = "Design Customization"
help = "Secondary mode-specific structural parameter."

[[feature.param]]
key = "scale"
flag = "--scale"
label = "World scale"
type = "float"
default = 1.0
min = 0.2
max = 3.0
group = "Design Customization"

[[feature.param]]
key = "chaos"
flag = "--chaos"
label = "Structured chaos"
type = "float"
default = 1.0
min = 0.0
max = 2.5
group = "Design Customization"

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Animation speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Emissive intensity"
type = "float"
default = 1.0
min = 0.1
max = 3.0
group = "Design Customization"

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8
group = "Output & Resolution"

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Render width"
type = "int"
default = 720
min = 240
max = 1920
group = "Output & Resolution"

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Render height"
type = "int"
default = 405
min = 135
max = 1080
group = "Output & Resolution"

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680
group = "Output & Resolution"

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320
group = "Output & Resolution"

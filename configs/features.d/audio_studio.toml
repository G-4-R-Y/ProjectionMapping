[[feature]]
id = "audio_reactive_studio"
name = "Audio Reactive Studio"
category = "Visual Madness"
description = "Curated music-reactive visual studio with semantic beat/onset gating, six visual presets, six palettes and calm-to-chaotic reactivity modes. Designed to react to musical structure instead of constant FFT noise. F11 toggles fullscreen."
command = ["python", "experiments/10_audio_reactive.py"]
fullscreen = true
requires_modules = ["soundcard"]

[[feature.param]]
key = "source"
flag = "--source"
label = "Audio source"
type = "choice"
default = "system"
choices = ["system", "mic"]

[[feature.param]]
key = "preset"
flag = "--preset"
label = "Visual preset"
type = "choice"
default = "spectral_bloom"
choices = ["spectral_bloom", "ribbon_cathedral", "pulse_tunnel", "caustic_field", "constellation", "mechanical_sync"]

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "neon_aurora"
choices = ["neon_aurora", "solar_flare", "bioluminescent", "intelli", "mono_accent", "prismatic"]

[[feature.param]]
key = "reactivity"
flag = "--reactivity"
label = "Reactivity"
type = "choice"
default = "balanced"
choices = ["smooth", "balanced", "punchy", "chaotic"]

[[feature.param]]
key = "madness"
flag = "--madness"
label = "Calm to madness"
type = "float"
default = 0.45
min = 0.0
max = 1.0

[[feature.param]]
key = "event_threshold"
flag = "--event-threshold"
label = "Strong onset threshold"
type = "float"
default = 0.62
min = 0.25
max = 0.95

[[feature.param]]
key = "beat_threshold"
flag = "--beat-threshold"
label = "Beat / kick threshold"
type = "float"
default = 0.50
min = 0.20
max = 0.90

[[feature.param]]
key = "sensitivity"
flag = "--sensitivity"
label = "Input sensitivity"
type = "float"
default = 1.8
min = 0.1
max = 8.0

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "device"
flag = "--device"
label = "Audio device name/id (optional)"
type = "text"
default = ""

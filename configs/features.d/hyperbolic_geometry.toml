[[feature]]
id = "hyperbolic_geometry_lab"
name = "Hyperbolic Geometry Lab / GPU"
category = "Visual Madness"
description = "Poincare and Klein disk geometry, exact Mobius transforms, circle inversions / Schottky-style orbits, hyperbolic geodesics, and modular-group reduction in the upper half-plane. F11 toggles fullscreen."
command = ["python", "experiments/27_hyperbolic_geometry_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "mode"
flag = "--mode"
label = "Geometry world"
type = "choice"
default = "poincare_orbifold"
choices = ["poincare_orbifold", "hyperbolic_geodesics", "mobius_lattice", "schottky_inversions", "klein_chords", "modular_domain"]

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "ultraviolet"
choices = ["spectral", "electric", "solar", "bio", "ultraviolet", "icefire"]

[[feature.param]]
key = "chaos"
flag = "--chaos"
label = "Structured deformation"
type = "float"
default = 1.0
min = 0.0
max = 2.5

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Animation speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Emissive intensity"
type = "float"
default = 1.0
min = 0.1
max = 3.0

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Shader render width"
type = "int"
default = 960
min = 320
max = 1920

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Shader render height"
type = "int"
default = 540
min = 180
max = 1080

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature]]
id = "audio_particle_stage"
name = "Song Studio / GPU Particle Stage"
category = "Visual Madness"
description = "Music-driven GPU particle choreography with vivid emissive materials, phrase/section-aware Journey mode, persistent feedback/advection, and optional Polar Math or structured-chaos shader backdrops. Uses the shared MusicalSignals bus. F11 toggles fullscreen."
command = ["python", "experiments/16_audio_particle_stage.py"]
fullscreen = true
requires_modules = ["soundcard", "moderngl"]

[[feature.param]]
key = "source"
flag = "--source"
label = "Audio source"
type = "choice"
default = "system"
choices = ["system", "mic"]

[[feature.param]]
key = "bank"
flag = "--bank"
label = "Particle choreography"
type = "choice"
default = "journey"
choices = ["journey", "orbit_reactor", "dual_comet", "cathedral_rain", "vortex_gate", "constellation_bloom", "reactor_bloom", "polar_gate", "ritual_rain", "helix_fountain", "nebula_bloom", "techno_lattice", "lissajous_storm", "singularity_crown", "prism_shards"]

[[feature.param]]
key = "backdrop"
flag = "--backdrop"
label = "Backdrop / conductor layer"
type = "choice"
default = "none"
choices = ["none", "auto", "rose_lattice", "hypotrochoid_engine", "log_spiral_interference", "phyllotaxis_reactor", "bessel_wave_chamber", "scene:event_horizon", "scene:aurora_void", "scene:liquid_chrome", "scene:neon_cathedral", "scene:wormhole_choir", "scene:plasma_singularity", "scene:vortex_crown", "scene:collapse_flower"]

[[feature.param]]
key = "backdrop_palette"
flag = "--backdrop-palette"
label = "Polar backdrop palette"
type = "choice"
default = "spectral"
choices = ["spectral", "cyber", "solar", "bio", "ultraviolet"]

[[feature.param]]
key = "backdrop_intensity"
flag = "--backdrop-intensity"
label = "Backdrop mix"
type = "float"
default = 0.28
min = 0.0
max = 1.0

[[feature.param]]
key = "backdrop_chaos"
flag = "--backdrop-chaos"
label = "Shader backdrop chaos"
type = "float"
default = 1.20
min = 0.0
max = 2.5

[[feature.param]]
key = "reactivity"
flag = "--reactivity"
label = "Musical reactivity"
type = "choice"
default = "balanced"
choices = ["smooth", "balanced", "punchy", "chaotic"]

[[feature.param]]
key = "madness"
flag = "--madness"
label = "Calm to madness"
type = "float"
default = 0.45
min = 0.0
max = 1.0

[[feature.param]]
key = "event_threshold"
flag = "--event-threshold"
label = "Strong onset gate"
type = "float"
default = 0.64
min = 0.30
max = 0.95

[[feature.param]]
key = "beat_threshold"
flag = "--beat-threshold"
label = "Beat / kick gate"
type = "float"
default = 0.50
min = 0.25
max = 0.90

[[feature.param]]
key = "capacity"
flag = "--capacity"
label = "GPU particle capacity"
type = "choice"
default = "32768"
choices = ["8192", "16384", "32768", "65536"]

[[feature.param]]
key = "analysis_size"
flag = "--analysis-size"
label = "Spectral analysis window"
type = "choice"
default = "2048"
choices = ["1024", "2048", "4096"]

[[feature.param]]
key = "blocksize"
flag = "--blocksize"
label = "Capture block"
type = "choice"
default = "256"
choices = ["128", "256", "512"]

[[feature.param]]
key = "sensitivity"
flag = "--sensitivity"
label = "Input sensitivity"
type = "float"
default = 1.20
min = 0.25
max = 3.0

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Particle render width"
type = "int"
default = 768
min = 320
max = 1920

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Particle render height"
type = "int"
default = 432
min = 180
max = 1080

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "device"
flag = "--device"
label = "Audio device name/id (optional)"
type = "text"
default = ""

[[feature]]
id = "human_reactor"
name = "Human Reactor"
category = "Visual Madness"
description = "Camera-driven silhouette reactor: foreground edges glow, motion becomes energy, and fast movement leaves persistent comet-like trails. No pose model required. F11 toggles fullscreen."
command = ["python", "experiments/12_human_reactor.py"]
fullscreen = true

[[feature.param]]
key = "camera"
flag = "--camera"
label = "Camera"
type = "int"
default = 0
min = 0
max = 16

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Reactor intensity"
type = "float"
default = 0.9
min = 0.0
max = 2.0

[[feature.param]]
key = "feedback"
flag = "--feedback"
label = "Trail persistence"
type = "float"
default = 0.90
min = 0.0
max = 0.985

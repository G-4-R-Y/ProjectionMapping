[[feature]]
id = "performance_director"
name = "Performance Director / Shader + Particles"
category = "Visual Madness"
description = "Unified audiovisual conductor with expressive piano mode, live browser dashboard, keyboard/OSC/MIDI control, beat/bar-quantized launches, cue-loop recording, optional Ableton Link clocking, OSC state feedback, persistent A/B snapshots and user journeys. Piano velocity, pitch, chord tension, note density/spread and sustain shape shaders and GPU particles continuously. F11 toggles fullscreen."
command = ["python", "experiments/33_performance_director.py"]
fullscreen = true
requires_modules = ["soundcard", "moderngl"]

[[feature.param]]
key = "source"
flag = "--source"
label = "Audio source"
type = "choice"
default = "system"
choices = ["system", "mic"]
group = "System & Input"

[[feature.param]]
key = "device"
flag = "--device"
label = "Audio device name/id (optional)"
type = "text"
default = ""
group = "System & Input"

[[feature.param]]
key = "osc_host"
flag = "--osc-host"
label = "OSC bind host"
type = "text"
default = "127.0.0.1"
group = "Live Control"
help = "OSC is localhost-only by default. Use another bind address only when you intentionally want LAN controllers."

[[feature.param]]
key = "osc_port"
flag = "--osc-port"
label = "OSC UDP port (0 = off)"
type = "int"
default = 9000
min = 0
max = 65535
group = "Live Control"

[[feature.param]]
key = "midi"
flag = "--midi"
label = "Enable MIDI input"
type = "bool"
default = false
group = "Live Control"

[[feature.param]]
key = "midi_mode"
flag = "--midi-mode"
label = "MIDI performance mode"
type = "choice"
default = "controls"
choices = ["controls", "piano"]
group = "Live Control"
help = "Piano mode uses musical note velocity, pitch, density, register spread, chord tension and pedals as continuous visual expression instead of treating every note as a button."

[[feature.param]]
key = "piano_hot_cues"
flag = "--piano-hot-cues"
label = "Low-key piano hot-cue zone"
type = "bool"
default = false
group = "Live Control"
help = "Optional. Disabled by default so the full keyboard remains playable."

[[feature.param]]
key = "piano_cue_note_base"
flag = "--piano-cue-note-base"
label = "Piano cue zone base MIDI note"
type = "int"
default = 21
min = 0
max = 120
group = "Live Control"

[[feature.param]]
key = "midi_device"
flag = "--midi-device"
label = "MIDI device substring"
type = "text"
default = ""
group = "Live Control"

[[feature.param]]
key = "midi_madness_cc"
flag = "--midi-madness-cc"
label = "MADNESS MIDI CC"
type = "int"
default = 1
min = 0
max = 127
group = "Live Control"

[[feature.param]]
key = "midi_note_base"
flag = "--midi-note-base"
label = "Hot-cue MIDI base note"
type = "int"
default = 36
min = 0
max = 115
group = "Live Control"

[[feature.param]]
key = "midi_output"
flag = "--midi-output"
label = "Enable MIDI state feedback"
type = "bool"
default = false
group = "Live Control"
help = "CC-only feedback; no note messages are sent. Disabled by default to avoid changing a piano's internal controls unexpectedly."

[[feature.param]]
key = "midi_output_device"
flag = "--midi-output-device"
label = "MIDI output device substring"
type = "text"
default = ""
group = "Live Control"

[[feature.param]]
key = "midi_feedback_cc_base"
flag = "--midi-feedback-cc-base"
label = "MIDI feedback CC base"
type = "int"
default = 20
min = 0
max = 123
group = "Live Control"

[[feature.param]]
key = "user_journey"
flag = "--user-journey"
label = "Saved user journey name"
type = "text"
default = ""
group = "Live Control"

[[feature.param]]
key = "load_snapshot"
flag = "--load-snapshot"
label = "Load snapshot on launch"
type = "text"
default = ""
group = "Live Control"

[[feature.param]]
key = "quantize"
flag = "--quantize"
label = "Live cue quantization"
type = "choice"
default = "beat"
choices = ["off", "beat", "bar"]
group = "Live Control"

[[feature.param]]
key = "dashboard_host"
flag = "--dashboard-host"
label = "Dashboard bind host"
type = "text"
default = "127.0.0.1"
group = "Live Control"

[[feature.param]]
key = "dashboard_port"
flag = "--dashboard-port"
label = "Browser dashboard port (0 = off)"
type = "int"
default = 8765
min = 0
max = 65535
group = "Live Control"

[[feature.param]]
key = "osc_state_host"
flag = "--osc-state-host"
label = "OSC state target host"
type = "text"
default = "127.0.0.1"
group = "Live Control"

[[feature.param]]
key = "osc_state_port"
flag = "--osc-state-port"
label = "OSC state target port (0 = off)"
type = "int"
default = 9001
min = 0
max = 65535
group = "Live Control"

[[feature.param]]
key = "ableton_link"
flag = "--ableton-link"
label = "Use Ableton Link clock"
type = "bool"
default = false
group = "Live Control"
help = "Optional GPLv3+ aalink integration. Install the link extra separately; not bundled into default desktop builds."

[[feature.param]]
key = "link_tempo"
flag = "--link-tempo"
label = "Initial Link tempo"
type = "float"
default = 120.0
min = 30.0
max = 300.0
group = "Live Control"

[[feature.param]]
key = "state_file"
flag = "--state-file"
label = "State vault path (optional)"
type = "text"
default = ""
group = "Performance & Advanced"

[[feature.param]]
key = "sensitivity"
flag = "--sensitivity"
label = "Input sensitivity"
type = "float"
default = 1.20
min = 0.25
max = 3.0
group = "System & Input"

[[feature.param]]
key = "journey"
flag = "--journey"
label = "Performance journey"
type = "choice"
default = "liquid_arc"
choices = ["liquid_arc", "neon_ritual", "cosmic_rave"]
group = "Design Customization"

[[feature.param]]
key = "director_mode"
flag = "--director-mode"
label = "Sequencing mode"
type = "choice"
default = "hybrid"
choices = ["hybrid", "musical", "timed"]
group = "Design Customization"

[[feature.param]]
key = "madness"
flag = "--madness"
label = "Master MADNESS"
type = "float"
default = 0.45
min = 0.0
max = 1.0
group = "Behavior & Reactivity"
help = "Shared base macro. Music and cue identity modulate this into shader chaos/intensity/palette drift and particle density/turbulence/bloom/field force."

[[feature.param]]
key = "reactivity"
flag = "--reactivity"
label = "Musical reactivity"
type = "choice"
default = "balanced"
choices = ["smooth", "balanced", "punchy", "chaotic"]
group = "Behavior & Reactivity"

[[feature.param]]
key = "cue_seconds"
flag = "--cue-seconds"
label = "Maximum cue duration"
type = "float"
default = 24.0
min = 4.0
max = 120.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "transition_seconds"
flag = "--transition-seconds"
label = "Cue morph seconds"
type = "float"
default = 3.0
min = 0.25
max = 12.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "minimum_dwell"
flag = "--minimum-dwell"
label = "Minimum cue dwell"
type = "float"
default = 5.0
min = 1.0
max = 30.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "event_threshold"
flag = "--event-threshold"
label = "Strong onset gate"
type = "float"
default = 0.62
min = 0.30
max = 0.95
group = "Behavior & Reactivity"

[[feature.param]]
key = "beat_threshold"
flag = "--beat-threshold"
label = "Beat / kick gate"
type = "float"
default = 0.48
min = 0.25
max = 0.90
group = "Behavior & Reactivity"

[[feature.param]]
key = "capacity"
flag = "--capacity"
label = "GPU particle capacity"
type = "choice"
default = "32768"
choices = ["8192", "16384", "32768", "65536"]
group = "Performance & Advanced"

[[feature.param]]
key = "analysis_size"
flag = "--analysis-size"
label = "Spectral analysis window"
type = "choice"
default = "2048"
choices = ["1024", "2048", "4096"]
group = "Performance & Advanced"

[[feature.param]]
key = "blocksize"
flag = "--blocksize"
label = "Capture block"
type = "choice"
default = "256"
choices = ["128", "256", "512"]
group = "Performance & Advanced"

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8
group = "Output & Resolution"

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Render width"
type = "int"
default = 768
min = 320
max = 1920
group = "Output & Resolution"

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Render height"
type = "int"
default = 432
min = 180
max = 1080
group = "Output & Resolution"

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680
group = "Output & Resolution"

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320
group = "Output & Resolution"

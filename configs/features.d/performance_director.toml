[[feature]]
id = "performance_director"
name = "Performance Director / Shader + Particles"
category = "Visual Madness"
description = "Unified audiovisual conductor: music-aware section/phrase tracking chooses coordinated shader presets and GPU particle choreography while one smoothed MADNESS macro drives chaos, palette drift, scene morphing, particle density/turbulence/bloom, vector-field force, and layer composition. Hybrid mode follows musical structure but falls back to authored timed journeys. F11 toggles fullscreen."
command = ["python", "experiments/33_performance_director.py"]
fullscreen = true
requires_modules = ["soundcard", "moderngl"]

[[feature.param]]
key = "source"
flag = "--source"
label = "Audio source"
type = "choice"
default = "system"
choices = ["system", "mic"]
group = "System & Input"

[[feature.param]]
key = "device"
flag = "--device"
label = "Audio device name/id (optional)"
type = "text"
default = ""
group = "System & Input"

[[feature.param]]
key = "sensitivity"
flag = "--sensitivity"
label = "Input sensitivity"
type = "float"
default = 1.20
min = 0.25
max = 3.0
group = "System & Input"

[[feature.param]]
key = "journey"
flag = "--journey"
label = "Performance journey"
type = "choice"
default = "liquid_arc"
choices = ["liquid_arc", "neon_ritual", "cosmic_rave"]
group = "Design Customization"

[[feature.param]]
key = "director_mode"
flag = "--director-mode"
label = "Sequencing mode"
type = "choice"
default = "hybrid"
choices = ["hybrid", "musical", "timed"]
group = "Design Customization"

[[feature.param]]
key = "madness"
flag = "--madness"
label = "Master MADNESS"
type = "float"
default = 0.45
min = 0.0
max = 1.0
group = "Behavior & Reactivity"
help = "Shared base macro. Music and cue identity modulate this into shader chaos/intensity/palette drift and particle density/turbulence/bloom/field force."

[[feature.param]]
key = "reactivity"
flag = "--reactivity"
label = "Musical reactivity"
type = "choice"
default = "balanced"
choices = ["smooth", "balanced", "punchy", "chaotic"]
group = "Behavior & Reactivity"

[[feature.param]]
key = "cue_seconds"
flag = "--cue-seconds"
label = "Maximum cue duration"
type = "float"
default = 24.0
min = 4.0
max = 120.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "transition_seconds"
flag = "--transition-seconds"
label = "Cue morph seconds"
type = "float"
default = 3.0
min = 0.25
max = 12.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "minimum_dwell"
flag = "--minimum-dwell"
label = "Minimum cue dwell"
type = "float"
default = 5.0
min = 1.0
max = 30.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "event_threshold"
flag = "--event-threshold"
label = "Strong onset gate"
type = "float"
default = 0.62
min = 0.30
max = 0.95
group = "Behavior & Reactivity"

[[feature.param]]
key = "beat_threshold"
flag = "--beat-threshold"
label = "Beat / kick gate"
type = "float"
default = 0.48
min = 0.25
max = 0.90
group = "Behavior & Reactivity"

[[feature.param]]
key = "capacity"
flag = "--capacity"
label = "GPU particle capacity"
type = "choice"
default = "32768"
choices = ["8192", "16384", "32768", "65536"]
group = "Performance & Advanced"

[[feature.param]]
key = "analysis_size"
flag = "--analysis-size"
label = "Spectral analysis window"
type = "choice"
default = "2048"
choices = ["1024", "2048", "4096"]
group = "Performance & Advanced"

[[feature.param]]
key = "blocksize"
flag = "--blocksize"
label = "Capture block"
type = "choice"
default = "256"
choices = ["128", "256", "512"]
group = "Performance & Advanced"

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8
group = "Output & Resolution"

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Render width"
type = "int"
default = 768
min = 320
max = 1920
group = "Output & Resolution"

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Render height"
type = "int"
default = 432
min = 180
max = 1080
group = "Output & Resolution"

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680
group = "Output & Resolution"

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320
group = "Output & Resolution"

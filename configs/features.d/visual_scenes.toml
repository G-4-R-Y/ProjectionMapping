[[feature]]
id = "procedural_scene_lab"
name = "Procedural Scene Lab (legacy CPU)"
category = "Visual Madness"
description = "CPU fallback scene pack from the Visual Madness playbook. Portal seam fixed, but the ModernGL Shader Scene Lab is now the preferred high-end path. F11 toggles fullscreen."
command = ["python", "experiments/11_procedural_scenes.py"]
fullscreen = true

[[feature.param]]
key = "scene"
flag = "--scene"
label = "Scene"
type = "choice"
default = "portal"
choices = ["portal", "infestation", "cathedral", "mechanical", "moss_ruin", "starfield"]

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Intensity / madness"
type = "float"
default = 0.75
min = 0.0
max = 2.0

[[feature]]
id = "shader_scene_lab"
name = "Shader Scene Lab / ModernGL"
category = "Visual Madness"
description = "GPU fragment-shader performance lab with liquid/chrome/oil/ferrofluid families, cyan-magenta-first palette control, palette cycling, and crossfading between any two scenes. F11 toggles fullscreen."
command = ["python", "experiments/14_shader_scene_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "scene"
flag = "--scene"
label = "Shader scene"
type = "choice"
default = "liquid_chrome"
choices = ["liquid_chrome", "liquid_membrane", "ferrofluid_bloom", "holographic_oil", "data_tide", "event_horizon", "aurora_void", "neon_cathedral", "wormhole_choir", "plasma_singularity", "vortex_crown", "collapse_flower"]

[[feature.param]]
key = "scene_b"
flag = "--scene-b"
label = "Crossfade target"
type = "choice"
default = "holographic_oil"
choices = ["liquid_chrome", "liquid_membrane", "ferrofluid_bloom", "holographic_oil", "data_tide", "event_horizon", "aurora_void", "neon_cathedral", "wormhole_choir", "plasma_singularity", "vortex_crown", "collapse_flower"]

[[feature.param]]
key = "scene_mix"
flag = "--scene-mix"
label = "Scene crossfade"
type = "float"
default = 0.18
min = 0.0
max = 1.0

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "cyan_magenta"
choices = ["cyan_magenta", "ultraviolet", "deep_ocean", "sunset_neon", "spectral", "mono"]

[[feature.param]]
key = "palette_cycle"
flag = "--palette-cycle"
label = "Palette drift"
type = "float"
default = 0.025
min = -0.25
max = 0.25

[[feature.param]]
key = "chaos"
flag = "--chaos"
label = "Structured chaos"
type = "float"
default = 1.15
min = 0.0
max = 2.5

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Shader render width"
type = "int"
default = 960
min = 320
max = 1920

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Shader render height"
type = "int"
default = 540

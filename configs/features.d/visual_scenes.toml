[[feature]]
id = "procedural_scene_lab"
name = "Procedural Scene Lab"
category = "Visual Madness"
description = "Immediate-run scene pack from the Visual Madness playbook: portal architecture, bioluminescent infestation, liquid cathedral, mechanical possession, ancient ruin/living moss, and ceiling starfield. No camera or AI model required. F11 toggles fullscreen."
command = ["python", "experiments/11_procedural_scenes.py"]
fullscreen = true

[[feature.param]]
key = "scene"
flag = "--scene"
label = "Scene"
type = "choice"
default = "portal"
choices = ["portal", "infestation", "cathedral", "mechanical", "moss_ruin", "starfield"]

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Intensity / madness"
type = "float"
default = 0.75
min = 0.0
max = 2.0

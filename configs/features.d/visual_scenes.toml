[[feature]]
id = "procedural_scene_lab"
name = "Procedural Scene Lab (legacy CPU)"
category = "Visual Madness"
description = "CPU fallback scene pack from the Visual Madness playbook. Portal seam fixed, but the ModernGL Shader Scene Lab is now the preferred high-end path. F11 toggles fullscreen."
command = ["python", "experiments/11_procedural_scenes.py"]
fullscreen = true

[[feature.param]]
key = "scene"
flag = "--scene"
label = "Scene"
type = "choice"
default = "portal"
choices = ["portal", "infestation", "cathedral", "mechanical", "moss_ruin", "starfield"]

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Intensity / madness"
type = "float"
default = 0.75
min = 0.0
max = 2.0

[[feature]]
id = "shader_scene_lab"
name = "Shader Scene Lab / ModernGL"
category = "Visual Madness"
description = "Twelve GPU shader worlds spanning liquid metal, singularities, architecture, crystal, solar, bioluminescent and prismatic compositions. Includes one-click authored performance presets. F11 toggles fullscreen."
command = ["python", "experiments/14_shader_scene_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "preset"
flag = "--preset"
label = "Authored look"
type = "choice"
default = "mercury_temple"
choices = ["custom", "mercury_temple", "black_sun_corona", "aurora_silk", "neon_reliquary", "choir_of_depth", "plasma_orchid", "vortex_coronation", "collapse_ritual", "amethyst_cavern", "solar_tapestry", "abyssal_bloom", "prismatic_altar"]
choice_labels = { custom = "Custom controls", mercury_temple = "Mercury Temple", black_sun_corona = "Black Sun Corona", aurora_silk = "Aurora Silk", neon_reliquary = "Neon Reliquary", choir_of_depth = "Choir of Depth", plasma_orchid = "Plasma Orchid", vortex_coronation = "Vortex Coronation", collapse_ritual = "Collapse Ritual", amethyst_cavern = "Amethyst Cavern", solar_tapestry = "Solar Tapestry", abyssal_bloom = "Abyssal Bloom", prismatic_altar = "Prismatic Altar" }
help = "An authored look sets scene, speed, intensity and chaos together. Choose custom to use the individual controls below."

[[feature.param]]
key = "scene"
flag = "--scene"
label = "Shader scene"
type = "choice"
default = "liquid_chrome"
choices = ["event_horizon", "aurora_void", "liquid_chrome", "neon_cathedral", "wormhole_choir", "plasma_singularity", "vortex_crown", "collapse_flower", "crystal_cavern", "solar_loom", "abyssal_garden", "prism_mirage"]
help = "Used when Authored look is custom."

[[feature.param]]
key = "chaos"
flag = "--chaos"
label = "Structured chaos"
type = "float"
default = 1.15
min = 0.0
max = 2.5
help = "Used when Authored look is custom."

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Shader render width"
type = "int"
default = 960
min = 320
max = 1920

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Shader render height"
type = "int"
default = 540
min = 240
max = 1080

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0
help = "Used when Authored look is custom."

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Intensity"
type = "float"
default = 1.0
min = 0.0
max = 2.5
help = "Used when Authored look is custom."

[[feature]]

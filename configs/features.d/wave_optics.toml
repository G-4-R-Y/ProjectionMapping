[[feature]]
id = "wave_optics_lab"
name = "Wave Optics Lab / GPU"
category = "Visual Madness"
description = "Realtime interference and diffraction worlds: Young double slit, Fresnel zone plates, Airy diffraction, coherent multi-source interference, moire gratings, and cusp-catastrophe-inspired wave fields. F11 toggles fullscreen."
command = ["python", "experiments/26_wave_optics_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "mode"
flag = "--mode"
label = "Optical equation / world"
type = "choice"
default = "multi_source_interference"
choices = ["young_double_slit", "fresnel_zone_plate", "airy_diffraction", "multi_source_interference", "moire_gratings", "cusp_catastrophe"]
group = "Design Customization"
help = "Select the underlying optics construction; each mode has a distinct mathematical identity."

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "spectral"
choices = ["spectral", "electric", "solar", "bio", "ultraviolet", "icefire"]
group = "Design Customization"

[[feature.param]]
key = "chaos"
flag = "--chaos"
label = "Structured perturbation"
type = "float"
default = 1.0
min = 0.0
max = 2.5
group = "Design Customization"
help = "Adds controlled departures from the ideal equation without replacing it with unstructured noise."

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Animation speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Emissive intensity"
type = "float"
default = 1.0
min = 0.1
max = 3.0
group = "Design Customization"

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8
group = "Output & Resolution"

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Shader render width"
type = "int"
default = 960
min = 320
max = 1920
group = "Output & Resolution"

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Shader render height"
type = "int"
default = 540
min = 180
max = 1080
group = "Output & Resolution"

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680
group = "Output & Resolution"

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320
group = "Output & Resolution"

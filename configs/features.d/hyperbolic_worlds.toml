[[feature]]
id = "hyperbolic_worlds_lab"
name = "Hyperbolic Worlds / GPU"
category = "Visual Madness"
description = "Conformal and hyperbolic geometry studies: Poincare geodesics, circle inversion, Mobius transforms, Schottky-like inversion orbits and hyperbolic kaleidoscopes. F11 toggles fullscreen."
command = ["python", "experiments/27_hyperbolic_worlds_lab.py"]
fullscreen = true
requires_modules = ["moderngl"]

[[feature.param]]
key = "mode"
flag = "--mode"
label = "Geometry family"
type = "choice"
default = "hyperbolic_kaleidoscope"
choices = ["poincare_geodesics", "circle_inversion", "mobius_flow", "schottky_orbits", "hyperbolic_kaleidoscope"]
group = "Design Customizations"
help = "Choose the mathematical identity of the scene; these are different constructions, not palette variants."

[[feature.param]]
key = "palette"
flag = "--palette"
label = "Palette"
type = "choice"
default = "spectral"
choices = ["spectral", "electric", "solar", "bio", "ultraviolet", "icefire"]
group = "Design Customizations"

[[feature.param]]
key = "chaos"
flag = "--chaos"
label = "Structured perturbation"
type = "float"
default = 1.0
min = 0.0
max = 2.5
group = "Design Customizations"
help = "Changes geometric density, inversion radii and harmonic complexity while preserving the scene's identity."

[[feature.param]]
key = "speed"
flag = "--speed"
label = "Animation speed"
type = "float"
default = 1.0
min = 0.05
max = 5.0
group = "Behavior & Reactivity"

[[feature.param]]
key = "intensity"
flag = "--intensity"
label = "Emissive intensity"
type = "float"
default = 1.0
min = 0.1
max = 3.0
group = "Design Customizations"

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8
group = "Output & Resolution"

[[feature.param]]
key = "render_width"
flag = "--render-width"
label = "Shader render width"
type = "int"
default = 960
min = 320
max = 1920
group = "Output & Resolution"

[[feature.param]]
key = "render_height"
flag = "--render-height"
label = "Shader render height"
type = "int"
default = 540
min = 180
max = 1080
group = "Output & Resolution"

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680
group = "Output & Resolution"

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320
group = "Output & Resolution"

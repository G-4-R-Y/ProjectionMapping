# ProjectionMapping interactive feature registry.
#
# Every [[feature]] becomes an item in the console UI. Parameters are rendered
# automatically. Prefer adding new experiences here instead of hard-coding UI.
# Commands are argv arrays: they are launched without a shell.

[[feature]]
id = "room_skin"
name = "Room Skin"
category = "Visual Madness"
description = "Geometry-conscious temporal material hallucination. Optical-flow advection + edge locking; designed to receive AI semantic keyframes as the stack evolves."
command = ["python", "experiments/09_room_skin.py"]
fullscreen = true

[[feature.param]]
key = "camera"
flag = "--camera"
label = "Camera"
type = "int"
default = 0
min = 0
max = 16

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "projector_width"
flag = "--projector-width"
label = "Projector width"
type = "int"
default = 1920
min = 320
max = 7680

[[feature.param]]
key = "projector_height"
flag = "--projector-height"
label = "Projector height"
type = "int"
default = 1080
min = 240
max = 4320

[[feature.param]]
key = "edge_strength"
flag = "--edge-strength"
label = "Physical edge lock"
type = "float"
default = 0.82
min = 0.0
max = 1.0
help = "Higher values preserve real room edges more strongly."

[[feature.param]]
key = "temporal_alpha"
flag = "--temporal-alpha"
label = "New-frame injection"
type = "float"
default = 0.24
min = 0.0
max = 1.0
help = "Lower = dreamier temporal memory; higher = faster visual mutation."

[[feature]]
id = "streamdiffusion_live"
name = "Neural Mirror / StreamDiffusion"
category = "Visual Madness"
description = "Live camera -> asynchronous StreamDiffusion -> projector or Spout. Latest-frame-wins so latency does not accumulate."
command = ["python", "experiments/04_streamdiffusion_live.py"]
fullscreen = true

[[feature.param]]
key = "camera"
flag = "--camera"
label = "Camera"
type = "int"
default = 0
min = 0
max = 16

[[feature.param]]
key = "display"
flag = "--display"
label = "Projector display"
type = "int"
default = 1
min = 0
max = 8

[[feature.param]]
key = "width"
flag = "--width"
label = "Inference width"
type = "int"
default = 768
min = 256
max = 1920

[[feature.param]]
key = "height"
flag = "--height"
label = "Inference height"
type = "int"
default = 432
min = 256
max = 1080

[[feature.param]]
key = "model"
flag = "--model"
label = "Model"
type = "text"
default = "stabilityai/sd-turbo"

[[feature.param]]
key = "prompt"
flag = "--prompt"
label = "Prompt"
type = "text"
default = "bioluminescent living architecture, immersive projection art"

[[feature.param]]
key = "negative_prompt"
flag = "--negative-prompt"
label = "Negative prompt"
type = "text"
default = "blurry, low quality, low resolution, text, watermark"

[[feature.param]]
key = "acceleration"
flag = "--acceleration"
label = "Acceleration"
type = "choice"
default = "xformers"
choices = ["none", "xformers", "tensorrt"]

[[feature.param]]
key = "submit_fps"
flag = "--submit-fps"
label = "AI submit FPS (0 = every frame)"
type = "float"
default = 0.0
min = 0.0
max = 240.0

[[feature.param]]
key = "spout"
flag = "--spout"
label = "Send via Spout"
type = "bool"
default = false

[[feature.param]]
key = "sender"
flag = "--sender"
label = "Spout sender"
type = "text"
default = "ProjectionMapping"

[[feature.param]]
key = "show_input"
flag = "--show-input"
label = "Show camera inset"
type = "bool"
default = false


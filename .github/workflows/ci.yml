name: CI (manual only)

# Cost guardrail: this workflow is intentionally manual-only.
# Do not add push, pull_request, schedule, or other automatic triggers
# without explicitly reviewing GitHub Actions billing impact.
on:
  workflow_dispatch:

jobs:
  tests:
    name: Linux / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev,vision,ui]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Ruff critical checks
        run: python -m ruff check src tests --select E9,F63,F7,F82
      - name: Pytest
        run: python -m pytest -q

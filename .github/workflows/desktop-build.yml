name: Desktop bundles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-build.yml"
      - "packaging/**"
      - "src/**"
      - "configs/**"
      - "experiments/**"
      - "pyproject.toml"
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ProjectionMapping-windows
          - os: ubuntu-latest
            artifact: ProjectionMapping-linux
          - os: macos-latest
            artifact: ProjectionMapping-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[ui,vision,audio,graphics,dev,desktop]'

      - name: Build desktop bundle
        run: python packaging/build_desktop.py

      - name: Archive bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ProjectionMapping/* -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Archive bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz ProjectionMapping

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
